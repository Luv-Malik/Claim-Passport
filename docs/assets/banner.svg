<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 380" width="1280" height="380" role="img" aria-label="Claim Passport banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#121b25"/><stop offset=".55" stop-color="#1b3a4b"/><stop offset="1" stop-color="#127C7A"/></linearGradient>
    <linearGradient id="or" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#C75B0B"/><stop offset="1" stop-color="#ea8a45"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".35"/></filter>
  </defs>
  <rect width="1280" height="380" rx="26" fill="url(#bg)"/>
  <circle cx="1090" cy="60" r="210" fill="#fff" opacity=".05"/><circle cx="1180" cy="330" r="150" fill="#C75B0B" opacity=".18"/><circle cx="90" cy="360" r="130" fill="#fff" opacity=".04"/>
  <rect x="64" y="64" width="64" height="64" rx="18" fill="url(#or)" filter="url(#sh)"/>
  <path d="M82 98l11 11 22-24" stroke="#fff" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="148" y="108" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="52" font-weight="800" fill="#fff" letter-spacing="-1.5">Claim Passport</text>
  <text x="66" y="182" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="27" fill="#d7e6ee">Check content before it is published.</text>
  <text x="66" y="220" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="27" fill="#ffffff" font-weight="700">Keep every published claim true afterwards.</text>
  <g font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="19" font-weight="700">
    <rect x="66" y="268" width="150" height="44" rx="22" fill="#d6f0df"/><circle cx="92" cy="290" r="9" fill="#1fa463"/><path d="M87 290l4 4 7-8" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="110" y="297" fill="#14693f">Valid</text>
    <rect x="232" y="268" width="190" height="44" rx="22" fill="#fcefc4"/><circle cx="258" cy="290" r="9" fill="#e3a008"/><text x="253" y="296" fill="#fff" font-size="14">!</text><text x="276" y="297" fill="#7a5600">Expiring soon</text>
    <rect x="438" y="268" width="228" height="44" rx="22" fill="#f8d9d9"/><circle cx="464" cy="290" r="9" fill="#d64545"/><path d="M460 286l8 8M468 286l-8 8" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/><text x="482" y="297" fill="#9b2a2a">Source changed</text>
  </g>
  <g filter="url(#sh)">
    <rect x="780" y="58" width="400" height="150" rx="22" fill="#fff"/>
    <text x="808" y="100" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="20" font-weight="700" fill="#17202a">Plans start at Rs. 599 per month</text>
    <rect x="808" y="116" width="220" height="11" rx="5" fill="#dfe5ec"/><rect x="808" y="136" width="300" height="11" rx="5" fill="#dfe5ec"/>
    <rect x="808" y="162" width="300" height="32" rx="16" fill="#f8d9d9"/><text x="826" y="184" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#9b2a2a">Approved fact says Rs. 499. Fix ready.</text>
    <rect x="860" y="228" width="340" height="104" rx="22" fill="#fff"/>
    <circle cx="902" cy="280" r="26" fill="url(#or)"/><path d="M890 280l9 9 16-18" stroke="#fff" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="944" y="274" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#17202a">A person approves</text>
    <text x="944" y="300" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" fill="#647085">Nothing changes on its own</text>
  </g>
</svg>
